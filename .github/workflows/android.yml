name: Build Android APK

on:
  push:
    branches: [main, android-native-mvp]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore permanent signing key
        env:
          BANDWATCH_KEYSTORE_BASE64: ${{ secrets.BANDWATCH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BANDWATCH_KEYSTORE_BASE64" ]; then
            echo "::error::Add the BandWatch signing secrets in repository Settings before building."
            exit 1
          fi
          echo "$BANDWATCH_KEYSTORE_BASE64" | base64 --decode > bandwatch-release.jks
      - name: Run unit tests and build signed debug APK
        env:
          BANDWATCH_KEYSTORE_PASSWORD: ${{ secrets.BANDWATCH_KEYSTORE_PASSWORD }}
          BANDWATCH_KEY_ALIAS: ${{ secrets.BANDWATCH_KEY_ALIAS }}
          BANDWATCH_KEY_PASSWORD: ${{ secrets.BANDWATCH_KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BandWatch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
